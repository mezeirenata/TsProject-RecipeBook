<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReceptNapló</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="src/style.css">
  </head>
  <body data-bs-theme="light">

<!--top navbar  -->
  <div class="container-fluid w-100 mx-0  bg-brown ">
      <nav class="navbar navbar-expand-lg pb-0 ">
        <div class="container my-2 ">
          <a class="navbar-brand text-danger fw-bold " id="title" href="#">RECEPT<span class="text-success">NAPLÓ</span></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse " id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto pb-0 mb-lg-0 d-flex justify-between">
              <li class="nav-item text-center mx-1">
                <a class="active btn btn-outline-danger py-2 rounded px-4 mb-2 w-100" aria-current="page" href="#">Receptek</a>
              </li>
              <li class="nav-item text-center mx-1">
                <a class="px-4 py-2 btn btn-outline-danger w-100" href="ingredients.html">Hozzávalók</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
  </div>
<!-- background -->
  <div class="container-fluid shadow" id="navbar">
      
  </div>
<!-- bottom navbar -->
  <div class="container-fluid  mb-5 shadow py-2 " id="functionable-navbar" >
              <div class="container">
                <nav class="navbar navbar-expand-lg ">
                  <div class="container-fluid">
                  <form class="d-flex mx-1" role="search" onsubmit="event.preventDefault()">
                    <input class="form-control py-2 border-start-radius" id="search-input" type="search" placeholder="Keresés.." aria-label="Search"/>
                    <button class="btn border-tertiary border-1 text-muted bg-body-tertiary border-end-radius px-3" id="btn-search"  type="button"><i class="bi bi-search"></i></button>
                  </form>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#filters" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                      <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="filters">
                      <ul class="navbar-nav me-auto mb-lg-0 mx-3 mt-2">
                        <li class="nav-item dropdown mx-1 mb-2">
                            <select class="form-select ps-3 py-2 pe-5" name="select-category" id="select-category">
                                <option selected value="" class=" form-select-option text-muted">Kategória választása..</option>
                            </select>
                        </li>
                        <li class="nav-item dropdown mx-1 mb-2 me-2">
                            <select class="form-select ps-3 py-2 pe-5" name="select-type" id="select-type">
                                <option selected value="" class=" form-select-option text-muted">Elkészítési mód választása..</option>
                            </select>
                        </li>
                        <div class="d-flex flex-nowrap justicy-content-between">

                        <li class="nav-item  mx-auto ">
                            <button class="btn rounded d-none btn-outline-danger px-4 bg-danger-subtle py-2 btn-sm d-flex flex-nowrap" id="btn-clear">
                              <i class="bi bi-x me-1 my-auto  "></i><span class="fs-6 me-1">Mezők</span><span class="fs-6"> törlése</span>
                            </button>
                        </li>
                        </div>
                      
                      </ul>
                    </div>
                  </div>
                </nav>
              </div>
  </div>


<!-- recipes empty -->
  <div class="container mt-5 d-none" id="zero-found">
    <div class="row">
      <h3 class="fw-bold text-center mt-3">Még nincs feltöltött recept.</h3>
      <h5 class="text-center mb-3 text-muted">Töltse fel az első receptet az alábbi gombra kattintva!</h5>
      <button data-bs-toggle="modal" data-bs-target="#recipe-modal" class="plus-btn btn mx-auto col-12 col-md-6 btn-outline-success  border-success border-3  alert alert-secondary shadow" >
      <h1 class="my-auto"><i class="bi bi-plus-circle text-success"></i></h1>
      </button>

    </div>
  </div>  

<!-- recipes list -->
  <div class="container mb-5" id="recipes-list-container">
    <div class="row my-5" id="recipes-list">
    </div>
  </div>
<!-- api hiba -->
  <div class="container w-50 mx-auto alert-danger alert text-center d-none mt-4 fw-bold" id="api-error"></div>
<!-- no matches found -->
  <div class="container mt-2 col-12 mx-auto col-lg-4 d-none" id="not-found">
    <div class="card  mx-auto mb-3 row" >
    <div class="card-header bg-secondary pt-3 pb-2">
    </div>
   <div class="card-body d-flex overflow-x-auto justify-content-between gap-3">
  <div class="search-container-style rounded-circle bg-success-subtle my-auto d-flex align-items-center justify-content-center flex-shrink-0">
    <i class="bi bi-search text-success fs-4 "></i>
  </div>

  <div class="flex-grow-1">
    <p class="text-muted fs-4 mb-0 d-flex flex-wrap" id="not-found-message">
      Nincs találat.
    </p>

    <p class="text-muted fs-6 mb-0">
      Próbálkozzon más kulcsszavakkal, vagy szűréssel!
    </p>
  </div>
</div>
  </div>
  </div>

<!-- hozzáadás gomb -> modal -->
  <div class="modal fade  " id="recipe-modal" tabindex="-1" >
        <div class="modal-dialog ">
            <form id="recipe-form" class="modal-content">
                <div class="modal-header   p-0 d-flex flex-wrap bg-dark">
                    <!-- images/placeholder.png -->
                    <img id="modal-header-image" class=" object-fit-cover rounded-top text-center bg-secondary-subtle text-muted fw-bold " src="images/placeholder.png"  alt="Recept indexképe" >
                    <button id="btn-close-modal"  class="btn-close-modal btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" style="opacity: 0%;">
                    </button>
                      <button id="btn-close-modal-shown"  class="btn-close-modal details-display  btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" >
                    </button>
                    <div class="d-flex w-100 py-2"> 
                      <div class="my-2 ms-3 w-50 d-flex  flex-nowrap d-none  new-display">
                          <input type="text" id="p-name" placeholder="Recept neve "  class=" form-control " ><span class="ms-1 text-danger new-display">*</span>
                      </div> 
                      <div class="my-2 d-flex flex-nowrap ms-3 w-100 col d-none details-display " >
                        <p  id="details-recipe-name"  class=" text-white my-auto fw-bold fs-6" ></p>
                        <div class="btn btn-warning ms-auto me-3" id="edit-btn"><i class="bi bi-pencil"></i></div>
                      </div> 
                      <div class="my-2 ms-auto d-flex flex-nowrap w-50 d-none edit-display  " >
                        <div class="btn btn-success ms-auto me-2" id="save-edit-btn"><i class="bi bi-floppy"></i></div>
                        <div class="btn btn-outline-danger  me-3" id="cancel-edit-btn">Mégse</div>
                      </div> 
                    </div>
                  </div>
                  <div class="my-1 mx-3 alert-dismissible show fade alert alert-danger" role="alert" id="modal-alert">
                    <p id="modal-alert-content" class="pb-0 mb-0">Hiba történt.</p>
                    <div  class="btn-close my-0" id="alert-btn-close" aria-label="Close"></div>
                  </div>
                <div class="modal-body bg-light overflow-y-auto h-400">
              

                    <div class="row mb-4">
                        <div class="col new-display mt-3">
                            <label class="form-label mb-1 fw-bold">Kategória <span class="text-danger">*</span></label>
                            <select id="select-cat" class="form-select new-display">
                                <option value="" selected></option> 
                            </select>
                        </div>
                        <div class="col new-display mt-3">
                            <label class="form-label  mb-1 fw-bold" for="select-type ">Elkészítés módja <span class="text-danger new-display">*</span></label>
                            <select id="select-type-x" class="form-select new-display">
                                  <option value="" selected></option> 
                            </select>
                        </div>
                        <div class="col details-display d-flex pt-2  pb-3  mx-2 ">
                          <span class="badge me-2 fs-6 bg-info text-white" id="recipe-category-badge"></span>
                          <span class="badge fs-6 bg-warning text-dark" id="recipe-type-badge"></span>
                          <span class="ms-auto"><i class="bi fs-6 bi-clock-history my-auto me-2"></i><span id="details-time" class="fs-6"></span></span>
                        </div>
                     
                    </div>

                    <div class="mb-4 new-display">
                        <label for="" class="mb-1 fw-bold"><i class="bi fs-6 bi-clock-history my-auto me-2"></i>Elkészítési idő <span class="text-danger new-display">*</span></label>
                        <div class="row w-100 ">
                            <div class="col d-flex flex-nowrap w-100 me-4">
                                <input type="number" id="p-hour" min="0" placeholder="0" class=" form-control w-50"  >
                                <label for="" class="my-auto w-50 text-center">óra</label>
                            </div> 
                            <div class="col d-flex flex-nowrap  w-100">
                                <input type="number" id="p-minute" min="0" placeholder="0" class=" form-control w-50"  >
                                <label for="" class="my-auto w-50 text-center">perc</label>

                            </div>
                        </div>
                    </div>
                    

                    <div class="mt-4 new-display">
                      <label for="" class="fw-bold ms-1 mb-1">Kép feltöltése</label>
                        <div class="d-flex flex-nowrap">
                            <div class="my-auto  px-3 py-2 bg-secondary-subtle url-style"> URL</div>    
                            <input type="search" id="p-imageurl"  placeholder="https://pelda.png" class="form-control py-1 image-input-style" >
                        </div>
                    </div>

                    <div class="form-text text-start ms-1 mb-5 new-display">
                        <!-- ha üres-> tovább enged, placeholder az src, ha nem üres az input de rossz akkor nem enged tovább -->
                        PNG, JPG, JPEG vagy WEBP kép URL
                    </div>

                    <!-- hozzávalók -->
                    <div class="mb-4">
                        <div class="d-flex">
                            <label for="select-ingredients" class="mb-1 fw-bold">Hozzávalók<span class="ms-1 text-danger new-display">*</span></label>
                            <span class="text-end ms-auto badge bg-secondary me-1 fs-6 overflow-x-auto mb-1" style="max-width: 100%;">összesen: <span id="sum-price" >0</span> Ft</span>
                        </div>
                        <div class="navbar ">
                          <!-- új hozzávaló -->
                          <div class="w-75 d-flex flex-nowrap new-display">
                            <select name="select-ingredients" class="form-select mb-2 py-2 w-75 " id="ingredients-list">
                                <option value="" selected>Válasszon hozzávalót!</option>
                                <option value="" ></option>
                            </select>
                            <div class="btn btn-outline-success mb-2 d-flex justify-content-center px-4" id="btn-add-ingredient"><i class="bi bi-plus-lg"></i></div> 
                          </div>
                            <div class="navbar-toggler mb-auto py-1 new-display" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation" style="cursor: pointer;">
                            <span class="navbar-toggler-icon"></span>
                            </div>
                            <div class="collapse show navbar-collapse" id="navbarNavAltMarkup">
                                <ul class="list-group overflow-y-auto"  id="selected-ingredients" style="max-height:105px;">
                                  </ul>
                                 
                            </div>

                        </div>
                    </div>
                    <!-- lépések -->
                    <div class="mb-2">
                        <label for="input-step" class="fw-bold">Elkészítés lépései<span class="ms-1 text-danger new-display">*</span></label>
                        <div class="navbar mt-1 ">
                            <div class="mb-1 d-flex new-display flex-nowrap" style="width: 75%;">
                                <input type="search " placeholder="pl. Tegyél fel egy fazék vizet forrni." name="select-ingredients" class="form-control py-2  mb-1 w-75 me-0" id="input-step" >
                                <div class="btn btn-outline-success mb-1 d-flex justify-content-center px-4" id="btn-add-step"><i class="bi bi-plus-lg "></i></div> 
                            </div>
                            <div  class="new-display navbar-toggler mb-auto py-1" data-bs-toggle="collapse" data-bs-target="#steps" aria-controls="steps" aria-expanded="false" aria-label="Toggle navigation" style="cursor: pointer;">
                            <span class="navbar-toggler-icon"></span>
                            </div>
                            <div class="collapse navbar-collapse show " id="steps">
                                <ol class="list-group list-group-numbered overflow-y-auto py-2 "  id="steps-list" style="max-height: 120px;"  >
                                </ol>
                            </div>

                        </div>
                    </div>
                </div>          
                <div class="model-footer py-2 detail-display">
                  <p></p>
                </div>
                <div class="modal-footer  bg-white only-new-display">
                        <button class="btn btn-outline-secondary btn-close-modal " id="cancel-modal-btn" data-bs-dismiss="modal">Mégse</button>
                        <!-- változni fog a szöveg: "Hozzáadás" | "Mentés" -->
                        <div class="btn btn-success " id="save-recipe">Feltöltés</div>
                </div>
            </form>
        </div>
  </div>

    <script type="module" src="/src/main.ts"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>

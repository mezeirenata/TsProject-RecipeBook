                    <input class="form-control py-2 border-start-radius" id="search-input" type="search" placeholder="Keresés vagy #id.." aria-label="Search"/>
                    <button class="btn border-tertiary border-1 text-muted bg-body-tertiary border-end-radius px-3" id="btn-search"  type="button"><i class="bi bi-search"></i></button>

                      <ul class="navbar-nav me-auto mb-lg-0 mx-3 mt-2">

  <div class="container mt-5 d-none " id="zero-found">
    <div class="row">
      <h3 class="fw-bold text-center mt-3">Még nincs feltöltött recept.</h3>
      <h5 class="text-center mb-3 text-muted">Töltse fel az első receptet az alábbi gombra kattintva!</h5>
      <button data-bs-toggle="modal" data-bs-target="#projectModal" class="plus-btn btn mx-auto col-12 col-md-6 btn-outline-success  border-success border-3  alert alert-secondary shadow" >
      <h1 class="my-auto"><i class="bi bi-plus-circle text-success"></i></h1>
      </button>

    </div>
  </div>  

  <div class="container mb-5" >
    <div class="row my-5" id="recipes-list">
    </div>
  </div>
  
  <div class="container mt-2 col-12 mx-auto col-lg-4 d-none" id="not-found">
    <div class="card  mx-auto mb-3 row" >
    <div class="card-header bg-secondary pt-3 pb-2">
    </div>
   <div class="card-body d-flex overflow-x-auto justify-content-between gap-3">
  <div class="rounded-circle bg-success-subtle my-auto d-flex align-items-center justify-content-center flex-shrink-0" style="width:48px;height:48px;">
    <i class="bi bi-search text-success fs-4 "></i>
  </div>

  <div class="flex-grow-1">
    <p class="text-muted fs-4 mb-0 d-flex flex-wrap" id="not-found-message">
      Nincs találat.
    </p>

    <p class="text-muted fs-6 mb-0">
      Próbálkozzon más kulcsszavakkal, vagy szűréssel!
    </p>
  </div>
</div>
  </div>


  
  </div>
  <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog">
            <form id="project-form" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Projekt hozzáadása</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Projekt neve</label>
                        <input type="text" id="p-name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ügyfél</label>
                        <input type="text" id="p-client" class="form-control" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Határidő</label>
                            <input type="date" id="p-deadline" class="form-control" required>
                        </div>
                        <div class="col">
                            <label class="form-label">Kategória</label>
                            <select id="p-cat" class="form-select">
                                <option value="Web">Web</option>
                                <option value="Design">Design</option>
                                <option value="Marketing">Marketing</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Költségvetés (Ft)</label>
                        <input type="number" id="p-budget" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Mégse</button>
                    <button type="submit" class="btn btn-primary" id="save-project">Mentés</button>
                </div>
            </form>
        </div>
  </div>

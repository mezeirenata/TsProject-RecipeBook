<div class="container-fluid  mb-3 shadow py-2 " id="functionable-navbar" >
    <div class="container">
      <nav class="navbar navbar-expand-lg ">
        <div class="container-fluid">
        <form class="d-flex mx-1 my-2" role="search" onsubmit="event.preventDefault()">
          <input class="form-control py-2 border-start-radius" id="search-input" type="search" placeholder="Keresés.." aria-label="Search"/>
          <button class="btn border-tertiary border-1 text-muted bg-body-tertiary border-end-radius px-3" id="btn-search"  type="button"><i class="bi bi-search"></i></button>
          <div class="nav-item dropdown mx-1 me-2">
              <button class="btn rounded d-none py-2 btn-outline-danger px-4 bg-danger-subtle btn-sm d-flex flex-nowrap" id="btn-clear">
               <i class="bi bi-x me-1 my-auto  "></i><span class="fs-6 me-1">Mezők</span><span class="fs-6"> törlése</span>
             </button>
         </div>
        </form>
      </nav>
    </div>

  <div class="container mt-5 d-none" id="zero-found">
    <div class="row">
      <h3 class="fw-bold text-center mt-3">Még nincs feltöltött hozzávaló.</h3>
      <h5 class="text-center mb-3 text-muted">Töltse fel az első hozzávalót a táblázat első sorában!</h5>
    </div>
  </div>

  <div class="container mt-2 col-12 mx-auto col-md-6 d-none" id="not-found">
    <div class="card mx-auto mb-3 row">
      <div class="card-header bg-secondary pt-3 pb-2"></div>
      <div class="card-body d-flex justify-content-between gap-3">
        <div
          class="rounded-circle bg-success-subtle col-md-4 d-flex align-items-center justify-content-center flex-shrink-0"
          style="width:48px;height:48px;">
          <i class="bi bi-search text-success fs-4"></i>
        </div>
        <div class="col-md-8 me-auto d-flex flex-wrap w-100 overflow-x-auto">
          <p class="text-muted fs-4 me-5 my-auto d-flex flex-wrap w-100" id="not-found-message">Nincs találat.</p>
          <p class="text-muted fs-6 my-auto">Próbálkozzon más kulcsszavakkal!</p>
        </div>
      </div>
    </div>
  </div>
 <div class="container w-50 mx-auto alert-danger alert text-center d-none mt-4 fw-bold" id="api-error"></div>
  <div id="tableContainer" style="max-height: 550px;" class="overflow-y-auto container-lg mb-4 mt-0 p-0 mt-lg-5 ingredients-table-scroll">
    <table id="ingredientsTableEl" class="table table-hover w-100 mb-0 rounded-3 border border-secondary-subtle">
      <thead class="table-dark" style="position: sticky;">
        <tr>
          <th scope="col" class="text-center">Id</th>
          <th scope="col" class="text-center">Hozzávaló neve</th>
          <th scope="col" class="text-center">Mértékegység</th>
          <th scope="col" class="text-center">Egységár(Ft)</th>
          <th scope="col" class="text-center">Műveletek</th>
        </tr>
      </thead>
      <div>
        <tbody id="ingredientsTable" class="overflow-y-auto" style="overflow-y: scroll;">
          <!-- ide jön be dinamikusan -->
        </tbody>

      </div>
    </table>
  </div>

  <div id="notificationDiv">
    <button id="toggleNotification">Bezárás X</button>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link rel="stylesheet" href="src/styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <button type="submit" id="button"  data-bs-toggle="modal" data-bs-target="#recipe-modal" class="btn  btn-outline-success  border-success border-3   alert alert-secondary  card mx-auto shadow w-100 text-center plus-btn" style="height:1000px;"></button>
     <div class="modal fade " id="recipe-modal" tabindex="-1" >
        <div class="modal-dialog ">
            <form id="project-form" class="modal-content">
                <div class="modal-header p-0 d-flex flex-wrap bg-light">
                    <!-- images/placeholder.png -->
                     <!-- style="height: 350px;" -->
                    <img style="height: 350px;align-content: center;" class="w-100 rounded-top text-center bg-secondary-subtle text-muted fw-bold " src="images/placeholder.png"  alt="Recept indexképe" >
                    <button  type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal">
                    </button>
                        <div class="my-2 ms-3 w-50 d-flex">
                            <input type="text" id="p-name" placeholder="Recept neve "  class=" form-control" ><span class="ms-1 text-danger">*</span>
                        </div> 
                            <!-- ha csak olvasható
                        <div class="my-2 ms-3">
                            <input type="text" id="p-name" placeholder="Recept neve " readonly class="form-control-plaintext fw-bold"  style="cursor:default;">
                        </div> -->
                       <!-- id -> kiírni ha éppen a részletek vannak -->
                   
                </div>
                <div class="modal-body overflow-y-auto" style="height:400px;">
                
            
                    <div class="row mb-4 mt-3">
                           <div class="col">
                            <label class="form-label mb-1 fw-bold">Kategória <span class="text-danger">*</span></label>
                            <select id="select-cat" class="form-select ">
                                <!-- ez eltűnik, majd az első kategória pickelve -->
                                <option value="" selected>főétel</option> 
                            </select>
                        </div>
                        <div class="col">
                            <label class="form-label  mb-1 fw-bold">Elkészítés módja <span class="text-danger">*</span></label>
                            <select id="select-type" class="form-select ">
                                <!-- ez eltűnik, majd az első kategória pickelve -->
                                <option value="" selected>főzés</option> 
                            </select>
                        </div>
                     
                    </div>

                    <div class="mb-4">
                        <label for="" class="mb-2 fw-bold"><i class="bi fs-6 bi-clock-history my-auto me-2"></i>Elkészítési idő <span class="text-danger">*</span></label>
                        <div class="row w-100">
                            <div class="col d-flex flex-nowrap w-100 me-4">
                                <input type="number" id="p-hour" min="0" placeholder="0" class="form-control w-50"  >
                                <label for="" class="my-auto w-50 text-center">óra</label>
                            </div> 
                            <div class="col d-flex flex-nowrap  w-100">
                                <input type="number" id="p-minute" min="0" placeholder="0" class=" form-control w-50"  >
                                <label for="" class="my-auto w-50 text-center">perc</label>

                            </div>
                        </div>
                    </div>
                    

                    <div class="mt-5">
                        <div class="d-flex flex-nowrap">
                            <div class="my-auto  px-3 py-2 bg-secondary-subtle w-25" style="border-bottom-left-radius:1vh ;border-top-left-radius: 1vh;">Kép URL</div>    
                            <input type="text" id="p-imageurl" placeholder="https://pelda.png" style="border-bottom-left-radius:0vh ;border-top-left-radius: 0vh;" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-text text-start ms-1 mb-5">
                        <!-- ha üres-> tovább enged, placeholder az src, ha nem üres az input de rossz akkor nem enged tovább -->
                        PNG, JPG, JPEG vagy WEBP kép URL
                    </div>

                    <!-- hozzávalók -->
                    <div class="mb-5">
                        <div class="d-flex">
                            <label for="select-ingredients" class="mb-1 fw-bold">Hozzávalók<span class="ms-1 text-danger">*</span></label>
                            <span class="text-end ms-auto badge bg-secondary  me-1 overflow-x-auto mb-1" for="" style="max-width: 100%;">összesen: <span id="sum-price " >0</span> Ft</span>

                        </div>
                        <div class="navbar ">
                            <select name="select-ingredients" class="form-select mb-2 py-2 " style="width:60%;" id="ingredients-list">
                                <option value="" selected>Válasszon hozzávalót!</option>
                                <option value="" ></option>
                            </select>
                             <button class="navbar-toggler mb-auto py-1" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                            </button>
                            <div class="collapse show navbar-collapse" id="navbarNavAltMarkup">
                                <ul class="list-group overflow-y-auto"  id="selected-ingredients" style="max-height:105px;">
                                    <li class="list-group-item d-flex flex-wrap ingredient-item pb-3" >
                                        <div class="my-auto d-flex flex-nowrap w-100 fw-bold mb-1">
                                            <p id="ingredientid-name" class="mb-0 overflow-x-auto w-75 text-success">kenyér</p>
                                            <div class="ms-auto btn btn-outline-danger rounded my-auto p-0 px-1 fw-bold" id="delete-itemid"><i class="bi bi-x-lg"></i></div>
                                        </div>
                                        <div class="d-flex flex-nowrap w-100">
                                            <div class="d-flex flex-nowrap w-50">
                                                <label for="" class="me-2 my-auto">mennyiség (db/g): </label>
                                                <input type="number" placeholder="0" min="0" class="form-control " style="width: 35%;">
                                            </div>
                                            <div class=" d-flex flex-nowrap w-50">
                                                <span for="" class="ms-auto mt-auto badge p-2  bg-secondary-subtle text-dark">teljes ár: <span id="ingredientid-price">0</span> Ft</span>
                                            </div>
                                        </div>
                                    </li>
                                </>
                            </div>

                        </div>
                    </div>
                    <!-- lépések -->
                    <div class="mb-3">
                        <label for="select-ingredients" class="fw-bold">Elkészítés lépései<span class="ms-1 text-danger">*</span></label>
                        <div class="navbar mt-2">
                            <div class="mb-1 d-flex flex-nowrap" style="width: 85%;">
                                <input type="search " placeholder="pl. Tegyél fel egy fazék vizet forrni." name="select-ingredients" class="form-control py-2  mb-1 w-75 me-0" id="input-step" style="border-top-right-radius: 0vh;border-bottom-right-radius: 0vh;">
                                <div class="btn btn-outline-success ms-0 mb-1 py-2 px-2" style="width: 10%;border-top-left-radius: 0vh;border-bottom-left-radius: 0vh;" id="btn-add-step"><i class="bi bi-plus-lg"></i></div> 

                            </div>
                            <button class="navbar-toggler mb-auto py-1" type="button" data-bs-toggle="collapse" data-bs-target="#steps" aria-controls="steps" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                            </button>
                            <div class="collapse navbar-collapse show " id="steps">
                                <ol class="list-group list-group-numbered overflow-y-auto py-2 "  id="steps-list" style="max-height: 105px;"  >
                                    <li class=" rounded py-2  align-items-center list-group-item  d-flex flex-nowrap step-item" id="step-xyid">

                                    </li>
                                      <li class=" rounded py-2  align-items-center list-group-item  d-flex flex-nowrap step-item" id="step-xyid2">
                                        <div class="ms-2 my-auto overflow-x-auto">
                                            Lorem ipsum dolor amen
                                        </div>
                                        <div class="ms-auto btn btn-outline-danger my-auto p-0 px-1 fw-bold" id="delete-xyid2"><i class="bi bi-x-lg"></i></div>
                                    </li>
                                    <li class=" rounded py-2  align-items-center list-group-item d-flex flex-nowrap step-item" id="step-xyid2">
                                        <div class="ms-2 my-auto overflow-x-auto">
                                            Lorem ipsum dolor amen
                                        </div>
                                        <div class="ms-auto btn btn-outline-danger my-auto p-0 px-1  fw-bold" id="delete-xyid2"><i class="bi bi-x-lg"></i></div>
                                    </li>
                                    <li class=" rounded py-2  align-items-center list-group-item d-flex flex-nowrap step-item" id="step-xyid2">
                                        <div class="ms-2 my-auto overflow-x-auto">
                                            Lorem ipsum dolor amen
                                        </div>
                                        <div class="ms-auto btn btn-outline-danger my-auto p-0 px-1  fw-bold" id="delete-xyid2"><i class="bi bi-x-lg"></i></div>
                                    </li>
                                </ol>
                            </div>

                        </div>
                    </div>
                </div>          
                <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-outline-secondary" onclick="confirm('Biztosan bezárja az ablakot?')" data-bs-dismiss="modal">Mégse</button>
                        <!-- változni fog a szöveg: "Hozzáadás" | "Mentés" -->
                        <button type="submit" class="btn btn-success" id="save-project">Mentés</button>
                </div>
            </form>
        </div>
  </div>
  
<script>
    document.getElementById("button").addEventListener('click',() => {
        settime(); 
    });
    // + hozzáadás button click (amikor lépést ad hozzá) 
    function settime(){
        setTimeout(() => {            
                let container = document.getElementById("steps-list");
                container.scrollTop = container.scrollHeight;
            }, 500);  
    }
    
</script> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
